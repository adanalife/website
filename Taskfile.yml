# Taskfile for the dana.lol Middleman site.
#
# Cloudflare Pages is the deploy target for both staging (deploy:stage,
# project: dana-lol-staging, custom domain: www.whalecore.com) and
# production (deploy:prod, project: dana-lol-production, custom domain:
# www.dana.lol). The :s3-suffixed tasks are retained as a fallback in
# case CF Pages needs to be rolled back.

version: '3'

tasks:
  build:
    desc: Build the static site
    cmds:
      - bundle exec middleman build --bail

  img:add:
    desc: "Ingest photos into source/<article-dir>: archive original, watermark, strip EXIF (task img:add -- <article-dir> <photo>...)"
    cmds:
      - bundle exec script/ingest-image {{.CLI_ARGS}}

  img:watermark-corpus:
    desc: One-shot re-ingest of every committed image in place (archive first, watermark once)
    cmds:
      - |
        for dir in source/*/; do
          set -- "$dir"*.jpg "$dir"*.JPG "$dir"*.png
          files=(); for f in "$@"; do [ -f "$f" ] && files+=("$f"); done
          [ ${#files[@]} -gt 0 ] && INGEST_NO_ALT=1 bundle exec script/ingest-image "$dir" "${files[@]}"
        done

  post:worker:deploy:
    desc: Deploy the post-from-phone inbox worker (worker/)
    dir: worker
    cmds:
      - npm ci
      - npx wrangler deploy

  post:drain:
    desc: Turn every message in the inbox into a draft article PR (needs INBOX_URL + INBOX_TOKEN)
    cmds:
      - bundle exec script/drain-inbox {{.CLI_ARGS}}

  deploy:stage:
    desc: Deploy build/ to Cloudflare Pages staging (dana-lol-staging)
    cmds:
      - npx wrangler pages deploy build/ --project-name dana-lol-staging

  release:stage:
    desc: Build and deploy to Cloudflare Pages staging
    cmds:
      - task: build
      - task: deploy:stage

  deploy:prod:
    desc: Deploy build/ to Cloudflare Pages production (dana-lol-production)
    cmds:
      - npx wrangler pages deploy build/ --project-name dana-lol-production --branch main

  release:prod:
    desc: Build and deploy to Cloudflare Pages production
    cmds:
      - task: build
      - task: deploy:prod

  # --- Legacy S3 paths ------------------------------------------------------
  # Fallback in case the Cloudflare Pages path (deploy:stage, deploy:prod)
  # needs to be rolled back.

  deploy:stage:s3:
    desc: (fallback) Push build/ to staging S3 (set STAGE_S3_BUCKET and STAGE_CLOUDFRONT_DISTRIBUTION_ID)
    env:
      STATIC_SITE_BUCKET: $STAGE_S3_BUCKET
      STATIC_SITE_CLOUDFRONT: $STAGE_CLOUDFRONT_DISTRIBUTION_ID
    cmds:
      - bundle exec s3_website push --site build

  deploy:prod:s3:
    desc: (fallback) Push build/ to prod S3 (set PROD_S3_BUCKET and PROD_CLOUDFRONT_DISTRIBUTION_ID)
    env:
      STATIC_SITE_BUCKET: $PROD_S3_BUCKET
      STATIC_SITE_CLOUDFRONT: $PROD_CLOUDFRONT_DISTRIBUTION_ID
    cmds:
      - bundle exec s3_website push --site build

  release:stage:s3:
    desc: (fallback) Build and deploy to staging S3
    cmds:
      - task: build
      - task: deploy:stage:s3

  release:prod:s3:
    desc: (fallback) Build and deploy to prod S3
    cmds:
      - task: build
      - task: deploy:prod:s3
