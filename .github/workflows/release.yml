name: release
# Production deploy to Cloudflare Pages at a release tag.
on:
  push:
    tags:
      - v*
  # A manual re-deploy of an existing tag, for when the push-triggered run
  # failed on something outside the code (a Cloudflare hiccup, an expired
  # token). Pick the tag as the ref.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version-file: .tool-versions
        bundler-cache: true
    - name: Install ImageMagick
      run: sudo apt-get install -y imagemagick
    - name: Install pngout
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget --user-agent="Mozilla/5.0" https://www.jonof.id.au/files/kenutils/pngout-20200115-linux.tar.gz
        tar -xvf pngout-20200115-linux.tar.gz
        sudo mv pngout-20200115-linux/amd64/pngout /usr/local/bin/
        rm -rf pngout-20200115-linux*
    # Same cache scheme as staging.yml: middleman-images output under cache/,
    # keyed by source image hashes so the key only changes when images change
    # (a whole-repo hashFiles key would change every commit and never hit).
    # Identical path+key means release restores the cache staging saved.
    - name: Cache middleman-images output
      uses: actions/cache@v6
      with:
        path: cache
        key: middleman-images-${{ hashFiles('source/**/*.jpg', 'source/**/*.JPG', 'source/**/*.jpeg', 'source/**/*.png', 'source/**/*.gif', 'source/**/*.webp') }}
        restore-keys: |
          middleman-images-
    - name: Build the static site
      run: bundle exec middleman build --bail
    - name: Deploy to Cloudflare Pages (production)
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Tag checkouts have detached HEAD; --branch names the CF Pages
      # project's production branch ("main", set in infra's terraform,
      # independent of any git branch) so the deploy lands on the
      # production alias serving www.dana.lol.
      run: npx wrangler pages deploy build/ --project-name dana-lol-production --branch main

    - name: Discord notification
      # A rotated or deleted webhook returns 404 and must not fail a release
      # that already shipped; the notification is best-effort.
      continue-on-error: true
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        VERSION_TAG: ${{ github.ref_name }}
      uses: Ilshidur/action-discord@0.4.0
      with:
        # Link the tagged CHANGELOG.md, not a payload `compare` URL: releases
        # dispatch via workflow_dispatch, whose event payload has no `compare`.
        args: 'New release for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}): [{{ VERSION_TAG }}]({{ EVENT_PAYLOAD.repository.html_url }}/blob/{{ VERSION_TAG }}/CHANGELOG.md)'
