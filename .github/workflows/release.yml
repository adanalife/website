name: release
# Production deploy to Cloudflare Pages at a release tag.
on:
  push:
    tags:
      - v*
  # A manual re-deploy of an existing tag, for when the push-triggered run
  # failed on something outside the code (a Cloudflare hiccup, an expired
  # token). Pick the tag as the ref.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/install-ruby
    - name: Build the static site
      run: bundle exec middleman build --bail
    - name: Deploy to Cloudflare Pages (production)
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Tag checkouts have detached HEAD; --branch names the CF Pages
      # project's production branch ("main", set in infra's terraform,
      # independent of any git branch) so the deploy lands on the
      # production alias serving www.dana.lol.
      run: npx wrangler pages deploy build/ --project-name dana-lol-production --branch main

    - name: Discord notification
      # A rotated or deleted webhook returns 404 and must not fail a release
      # that already shipped; the notification is best-effort.
      #
      # Only the tag push announces. A workflow_dispatch run re-deploys a tag
      # that already shipped, which is operational rather than news. The alert
      # below stays unconditional: a re-deploy going red is exactly the case
      # worth paging on.
      if: github.event_name == 'push'
      continue-on-error: true
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        VERSION_TAG: ${{ github.ref_name }}
      uses: Ilshidur/action-discord@0.4.0
      with:
        # Link the tagged CHANGELOG.md, not a payload `compare` URL: a
        # workflow_dispatch event payload has no `compare`.
        args: 'New release for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}): [{{ VERSION_TAG }}]({{ EVENT_PAYLOAD.repository.html_url }}/blob/{{ VERSION_TAG }}/CHANGELOG.md)'

    # Nothing else says a release went red. The release PR merged green long
    # before the tag ran, so the only record is this run's own entry in a run
    # list nobody is watching.
    #
    # Last, so it is the catch-all: the announcement above cannot trip it,
    # since continue-on-error keeps a dead webhook out of the job's status.
    #
    # Best-effort for the same reason -- a failure to report a failure should
    # not become a second failure.
    - name: Alert Discord on failure
      if: failure()
      continue-on-error: true
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        VERSION_TAG: ${{ github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      uses: Ilshidur/action-discord@0.4.0
      with:
        # Points at the log rather than naming what failed: the build and the
        # Pages deploy both live in this job and either can be the one.
        args: 'Release failed for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}) at {{ VERSION_TAG }}: [run log]({{ RUN_URL }})'
