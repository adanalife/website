name: staging
on:
  push:
    branches: [main]

# Serialise, don't cancel. Two pushes close together would otherwise race, and
# the older deploy finishing last would leave staging on stale content — but
# cancelling has the same failure with a worse shape: merge a few PRs inside a
# minute and GitHub cancels the whole burst, tail included, so staging sits on
# an old commit with no failed run to notice and nothing left to re-run.
# Queueing converges on the newest merge. (Tag-triggered release.yml is NOT
# guarded — every release must ship.)
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/install-ruby
    - name: Build the static site
      env:
        STAGING: 'true'
      run: bundle exec middleman build --bail
    - name: Deploy to Cloudflare Pages (staging)
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # --branch must match the staging CF Pages project's production_branch
      # ("main", set in infra's terraform, independent of any git branch) —
      # its production alias is what serves www.whalecore.com. Pinning it
      # here means main merges land on whalecore.com.
      run: npx wrangler pages deploy build/ --project-name dana-lol-staging --branch main
