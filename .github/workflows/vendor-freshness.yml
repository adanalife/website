name: vendor-freshness

# Guards the third-party frontend assets vendored into source/assets, and pinned
# in that directory's vendor.txt: normalize.css and the et-book fonts.
# The check and the freshness report live in adanalife/infra's vendor.yml.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vendor-freshness:
    uses: adanalife/infra/.github/workflows/vendor.yml@main
    with:
      script: script/vendor.sh
