name: linting
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  misspell:
    name: misspell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: misspell
        # Advisory only: findings post as annotations and never fail the run
        # (the action's default fail_level is none), so a red step can only
        # mean reviewdog itself crashed — e.g. GitHub returns 422 "diff is
        # taking too long to generate" on PRs that rewrite the whole image
        # corpus. Don't let that noise fail the job.
        continue-on-error: true
        uses: reviewdog/action-misspell@v1
        with:
          github_token: ${{ secrets.github_token }}
          locale: "US"
          level: info
