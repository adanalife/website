name: pre-commit

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    uses: adanalife/infra/.github/workflows/hooks.yml@main
    with:
      runs-on: ubuntu-latest
      mise: false
      # image-shrinkable skips every file when jpegoptim is missing, so without
      # this it would pass by doing nothing — CI is where the verdict counts.
      setup: sudo apt-get update && sudo apt-get install -y --no-install-recommends jpegoptim
