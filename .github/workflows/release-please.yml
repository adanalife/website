name: release-please
# Trunk-based release flow: release-please maintains a standing release PR on
# main (version + CHANGELOG computed from conventional commits). Merging that
# PR creates the vX.Y.Z tag + GitHub Release, and the tag fires release.yml.
#
# It runs on the adanalife-automation app token, not GITHUB_TOKEN, and both
# halves of that matter. Anything github-actions[bot] triggers is held at
# `action_required` under the repo's first-time-contributor approval policy —
# a status the bot never outgrows — so its updates to the release PR branch
# leave the required checks unrun and the PR BLOCKED until someone clicks
# approve on each. And a GITHUB_TOKEN-pushed tag fires no push trigger at all,
# so release.yml never sees it. An app token is an ordinary actor on both
# counts: its pull_request events run unheld and
# its tag reaches release.yml on its own.
# workflow_dispatch is the manual re-run: release-please only rebuilds the PR
# when a *releasable* commit lands, so a run of chore-only merges leaves the
# branch on an old base. Dispatching rebases it off current main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Every write goes through the app token below; the job's own GITHUB_TOKEN
# needs nothing.
permissions:
  contents: read

# Serial, not cancel-in-progress: an interrupted run can leave the release PR
# half-updated.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint automation app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          # Without these the token carries the app installation's whole
          # permission set. release-please needs exactly two: contents to push
          # the branch and cut the tag, pull-requests to maintain the release PR.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
