name: release-please
# Trunk-based release flow, run by infra's shared release-please workflow: a
# standing release PR on main, with the version + CHANGELOG computed from
# conventional commits by release-please itself (no towncrier here). Merging
# that PR creates the vX.Y.Z tag + GitHub Release, and the tag fires
# release.yml.
#
# workflow_dispatch is the escape hatch for a stale release branch:
# release-please only rebuilds the PR when a *releasable* commit lands, so a
# run of chore-only merges leaves the branch on an old base. Dispatching
# rebases it off current main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    uses: adanalife/infra/.github/workflows/release-please.yml@main
    with:
      runs-on: ubuntu-latest
      changelog: false
    secrets: inherit
